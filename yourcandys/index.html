<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Seus Doces 🍬 - Rede Doce de Leite</title>
    <meta name="theme-color" content="#8d6e63">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fffaf0;
            color: #3e2723;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            min-height: 100vh;
            border-left: 2px solid #d7ccc8;
            border-right: 2px solid #d7ccc8;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 20px;
            border-bottom: 2px solid #d7ccc8;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        header h1 { font-size: 1.2rem; color: #8d6e63; }

        /* Estilo do Botão do Ranking no Header */
        .btn-ranking-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #fff8e1, #ffe0b2);
            border: 2px solid #ffa726;
            color: #e65100;
            padding: 10px 16px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            width: 100%;
            box-shadow: 0 4px 10px rgba(255, 152, 0, 0.12);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-ranking-header:hover { transform: translateY(-1px); }

        .content {
            flex: 1;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        
        /* Spinner */
        .loading-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 60px;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 4px solid #f5f0eb;
            border-top: 4px solid #8d6e63;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .candy-card {
            background: #fff8e1;
            border: 2px solid #ffb74d;
            border-radius: 16px;
            padding: 30px 20px;
            width: 100%;
            max-width: 350px;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(111, 78, 55, 0.05);
        }
        .candy-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        .candy-title {
            font-size: 1rem;
            color: #6d4c41;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .candy-count {
            font-size: 2.5rem;
            color: #d84315;
            font-weight: bold;
        }
        .error-msg {
            color: #d32f2f;
            margin-top: 20px;
            font-size: 0.95rem;
        }

        nav {
            display: flex;
            border-top: 2px solid #d7ccc8;
            background: #fff;
            position: sticky;
            bottom: 0;
        }
        nav a {
            flex: 1;
            text-align: center;
            padding: 15px;
            text-decoration: none;
            color: #8d6e63;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        nav a:hover, nav a.active {
            background-color: #f5f0eb;
            color: #3e2723;
        }
    </style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet">
<style id="ddl-global-font">
  html, body, button, input, textarea, select, option, a, label, h1, h2, h3, h4, h5, h6, p, span, div, li, small, strong, b, em, nav, header, footer {
    font-family: 'Bricolage Grotesque', sans-serif !important;
  }
</style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <h1>🍮 Doce de Leite</h1> 
            </div>
            <a href="/ranking/" class="btn-ranking-header">
                🏆 Ver Hall da Fama & Ranking
            </a>
        </header>

        <div class="content" id="main-content">
            <div class="loading-container" id="loading-spinner">
                <div class="spinner"></div>
            </div>
        </div>
<nav> <a href="/fyp/">Início</a> <a href="/createpost/">Criar Post</a> <a href="#" id="nav-meu-perfil">Meu Perfil</a> 
    </div>
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from '/config.js';

        
        const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
            auth: {
                storage: window.localStorage,
                persistSession: true,
                autoRefreshToken: true,
            }
        });

        async function initYourCandys() {
            const contentDiv = document.getElementById('main-content');

            const { data: { session } } = await supabase.auth.getSession();
            
            if (!session || !session.user) {
                alert("Você precisa estar logado para ver seus doces!");
                window.location.href = '/acesso/login/';
                return;
            }

            const userId = session.user.id;

            // Busca o perfil do usuário e o campo candys_count na tabela profiles
            const { data: perfil, error } = await supabase
                .from('profiles')
                .select('username, candys_count')
                .eq('id', userId)
                .single();

            if (error || !perfil) {
                contentDiv.innerHTML = `<div class="error-msg">Erro ao carregar seus dados: ${error ? error.message : 'Perfil não encontrado'}</div>`;
                return;
            }

            // A navegação antiga de perfil foi removida do site.
            // Não acessamos mais elementos que não existem.


            const quantidadeDoces = perfil.candys_count ?? 0;

            // Renderiza o card com o saldo de doces
            contentDiv.innerHTML = `
                <div style="font-size: 0.95rem; color: #8d6e63; margin-bottom: 10px;">Olá, <strong>@${escapeHtml(perfil.username)}</strong>!</div>
                <div class="candy-card">
                    <div class="candy-icon">🍬</div>
                    <div class="candy-title">Seu Saldo Total de Doces</div>
                    <div class="candy-count">${quantidadeDoces}</div>
                </div>
                <div style="margin-top: 30px; font-size: 0.85rem; color: #8d6e63; line-height: 1.4;">
                    Continue postando e interagindo na rede para faturar ainda mais doces e preparar o terreno para o seu <strong>Banco de Doces</strong>! 🚀
                </div>
            `;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        initYourCandys();
    </script>
</body>
</html>
