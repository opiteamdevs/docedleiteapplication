<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0 maximum-scale=1.0, user-scalable=no">
    <title>Página Não Encontrada - Rede Doce de Leite</title>
    <meta name="theme-color" content="#8d6e63">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fffaf0;
            color: #3e2723;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(111, 78, 55, 0.1);
            max-width: 420px;
            width: 90%;
            border: 2px solid #d7ccc8;
            text-align: center;
        }
        h1 { font-size: 5rem; color: #8d6e63; margin-bottom: 10px; }
        h2 { font-size: 1.3rem; color: #6d4c41; margin-bottom: 16px; }
        p { font-size: 0.95rem; color: #5d4037; line-height: 1.5; margin-bottom: 24px; }
        a {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background-color: #8d6e63;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        a:hover { background-color: #6d4c41; }
    </style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet">
<style id="ddl-global-font">
  html, body, button, input, textarea, select, option, a, label, h1, h2, h3, h4, h5, h6, p, span, div, li, small, strong, b, em, nav, header, footer {
    font-family: 'Bricolage Grotesque', sans-serif !important;
  }
</style>
</head>
<body>
    <div class="card">
        <h1>404</h1>
        <h2>O doce derreteu no caminho! 🍮</h2>
        <p>A página ou o perfil que você está procurando não existe ou foi abduzido pelo caldeirão do Doce de Leite.</p>
        <a href="/fyp/">Voltar para o Feed</a>
    </div>
</body>
</html>
