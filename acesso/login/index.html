<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0 maximum-scale=1.0, user-scalable=no">
    <title>Entrar - Rede Doce de Leite</title>
    <meta name="theme-color" content="#8d6e63">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fffaf0;
            color: #3e2723;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(111, 78, 55, 0.1);
            max-width: 400px;
            width: 90%;
            border: 2px solid #d7ccc8;
            text-align: center;
        }
        h2 { color: #8d6e63; margin-bottom: 24px; }
        input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 16px;
            border: 1px solid #d7ccc8;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            background-color: #faf8f5;
        }
        input:focus { border-color: #8d6e63; }
        button {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            background-color: #8d6e63;
            color: white;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #6d4c41; }
        
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 16px 0;
            color: #8d6e63;
            font-size: 0.85rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #d7ccc8;
        }
        .divider::before { margin-right: 10px; }
        .divider::after { margin-left: 10px; }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #d7ccc8;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            background-color: #faf8f5;
            color: #3e2723;
            transition: background 0.2s;
            text-decoration: none;
        }
        .social-btn:hover { background-color: #f0eae1; }
        .social-btn svg { width: 20px; height: 20px; margin-right: 10px; }

        .toggle-link {
            display: inline-block;
            color: #8d6e63;
            font-size: 0.9rem;
            text-decoration: underline;
            margin-top: 5px;
        }
        .toggle-link:hover { color: #6d4c41; }
        .msg { margin-top: 15px; font-size: 0.9rem; color: #d9534f; }
        .success { color: #4caf50; }
    </style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet">
<style id="ddl-global-font">
  html, body, button, input, textarea, select, option, a, label, h1, h2, h3, h4, h5, h6, p, span, div, li, small, strong, b, em, nav, header, footer {
    font-family: 'Bricolage Grotesque', sans-serif !important;
  }
</style>
</head>
<body>
    <div class="card">
        <h2>Entrar no Caos 🍮</h2>
        <form id="login-form">
            <input type="email" id="email" placeholder="Seu e-mail" required autocomplete="email">
            <input type="password" id="password" placeholder="Sua senha" required autocomplete="current-password">
            <button type="submit" id="btn-entrar">Entrar</button>
        </form>

        <div class="divider">ou entrar com</div>

        <!-- Botões Sociais -->
        <button type="button" id="btn-google" class="social-btn">
            <svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.4l3.7 2.9C6.5 7.1 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.6 14.7c-.2-.7-.4-1.5-.4-2.7s.2-2 .4-2.7L1.9 6.4C.7 8.8 0 11.3 0 14s.7 5.2 1.9 7.6l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.1-6.4-5.3L1.9 15.7C3.7 19.5 7.5 23 12 23z"/></svg>
            Google
        </button>

        <button type="button" id="btn-github" class="social-btn">
            <svg viewBox="0 0 24 24"><path fill="#3e2723" d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
            GitHub
        </button>

        <a href="/acesso/cadastro/" class="toggle-link">Não tem uma conta? Cadastre-se</a>
        <div class="msg" id="msg"></div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from '/config.js';
        import { ensurePrivateApiKey } from '/api-keys.js';

        
        const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        const form = document.getElementById('login-form');
        const msgDiv = document.getElementById('msg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            msgDiv.className = 'msg';
            msgDiv.textContent = 'Entrando...';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                msgDiv.textContent = 'Preencha todos os campos!';
                return;
            }

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                msgDiv.textContent = `Erro ao entrar: ${error.message}`;
            } else {
                msgDiv.className = 'msg success';
                msgDiv.textContent = 'Login efetuado! Preparando chave privada...';
                try { await ensurePrivateApiKey(supabase); }
                catch (keyError) { console.error('Chave privada:', keyError); }
                msgDiv.textContent = 'Login efetuado com sucesso! Redirecionando...';
                setTimeout(() => { window.location.href = '/'; }, 1000);
            }
        });

        // Lógica de Login Social (Google e GitHub)
        async function signInWithProvider(provider) {
            const { error } = await supabase.auth.signInWithOAuth({
                provider: provider,
                options: {
                    redirectTo: window.location.origin + '/'
                }
            });
            if (error) {
                msgDiv.textContent = `Erro ao entrar com ${provider}: ` + error.message;
            }
        }

        document.getElementById('btn-google').addEventListener('click', () => signInWithProvider('google'));
        document.getElementById('btn-github').addEventListener('click', () => signInWithProvider('github'));
    </script>
</body>
</html>
