<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Você (FYP) - Rede Doce de Leite</title>
    <meta name="theme-color" content="#8d6e63">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body, button, input, textarea, select, option, a, label, h1, h2, h3, h4, h5, h6, p, span, div, li, small, strong, b, em, nav, header, footer {
            font-family: 'Bricolage Grotesque', sans-serif !important;
        }

        body {
            background-color: #fffaf0;
            color: #3e2723;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .verified-badge {
            width: 16px;
            height: 16px;
            object-fit: contain;
            display: inline-block;
            vertical-align: -2px;
            margin-left: 4px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            min-height: 100vh;
            border-left: 2px solid #d7ccc8;
            border-right: 2px solid #d7ccc8;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 20px;
            border-bottom: 2px solid #d7ccc8;
            background-color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 {
            font-size: 1.2rem;
            color: #8d6e63;
        }

        .filters-bar {
            display: flex;
            gap: 8px;
            padding: 12px 20px;
            background-color: #faf8f5;
            border-bottom: 1px solid #d7ccc8;
            overflow-x: auto;
        }

        .filter-btn {
            background: #ffffff;
            border: 1px solid #d7ccc8;
            color: #8d6e63;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            background-color: #f5f0eb;
            color: #3e2723;
        }

        .filter-btn.active {
            background-color: #8d6e63;
            color: #ffffff;
            border-color: #8d6e63;
        }

        .feed {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .loading-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 60px;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 4px solid #f5f0eb;
            border-top: 4px solid #8d6e63;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .post-card {
            background: #ffffff;
            border: 1px solid #d7ccc8;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 5px rgba(111, 78, 55, 0.05);
            position: relative;
        }

        .post-card.is-ad {
            border: 2px solid #ffb74d;
            background: #fff8e1;
        }

        .ad-badge {
            font-size: 0.75rem;
            background: #ffb74d;
            color: #3e2723;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .post-author {
            font-weight: bold;
            color: #6d4c41;
            margin-bottom: 8px;
            font-size: 0.95rem;
            text-decoration: none;
            display: inline-block;
        }

        .post-author:hover {
            text-decoration: underline;
        }

        .post-content {
            font-size: 1rem;
            line-height: 1.4;
            color: #3e2723;
            margin-bottom: 12px;
            word-break: break-word;
        }

        .post-actions {
            display: flex;
            gap: 15px;
            font-size: 0.9rem;
            color: #8d6e63;
            border-top: 1px solid #f5f0eb;
            padding-top: 10px;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #8d6e63;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: transform 0.1s ease;
        }

        .action-btn:active {
            transform: scale(1.15);
        }

        .action-btn.liked {
            color: #d32f2f;
        }

        .empty-feed {
            text-align: center;
            color: #8d6e63;
            margin-top: 40px;
            font-size: 0.95rem;
        }

        nav {
            display: flex;
            border-top: 2px solid #d7ccc8;
            background: #fff;
            position: sticky;
            bottom: 0;
        }

        nav a {
            flex: 1;
            text-align: center;
            padding: 15px;
            text-decoration: none;
            color: #8d6e63;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        nav a:hover, nav a.active {
            background-color: #f5f0eb;
            color: #3e2723;
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>🍮 Doce de Leite</h1>
        </header>

        <div class="filters-bar">
            <button class="filter-btn active" onclick="mudarFiltro('fyp', this)">
                🎯 Para Você
            </button>
            <button class="filter-btn" onclick="mudarFiltro('novidades', this)">
                ✨ Novidades
            </button>
            <button class="filter-btn" onclick="mudarFiltro('popular', this)">
                🔥 Mais Popular
            </button>
            <button class="filter-btn" onclick="mudarFiltro('media', this)">
                ⚖️ Na Média
            </button>
        </div>

        <div class="feed" id="feed-container">
            <div class="loading-container">
                <div class="spinner"></div>
            </div>
        </div>

        <nav>
            <a href="/fyp/" class="active">Início</a>
            <a href="/createpost/">Criar Post</a>
            <a href="#" id="nav-meu-perfil">Meu Perfil</a>
        </nav>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from '/config.js';
        import { ensurePrivateApiKey } from '/api-keys.js';

        const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
            auth: {
                storage: window.localStorage,
                persistSession: true,
                autoRefreshToken: true
            }
        });

        let usuarioLogado = null;
        let postsGlobais = [];
        let perfisGlobais = {};
        let filtroAtual = 'fyp';

        const listaNegraPalavras = [
            "spam", "scam", "phishing", "hack", "hacker", "cracker", "bot",
            "gratis", "free", "ganhedinheiro", "rendaextra", "trabalheemcasa",
            "aposta", "bet", "cassino", "slot", "tigrinho", "fortune",
            "dinheirofacil", "trader", "sinal", "telegram", "t.me",
            "porn", "sex", "xxx", "nude", "nudes", "18+", "conteudoadulto",
            "idiota", "imbecil", "estupido", "burro", "otario", "patife",
            "canalha", "lixo", "desgracado", "maldito", "filhodaputa",
            "puta", "caralho", "merda", "bosta", "porra", "arrombado",
            "corno", "vagabundo", "golpe", "piramide"
        ];

        // 🛡️ Filtro Avançado com Suporte a Acentos e Limpeza de Espaços
        function verificarConteudoProibido(texto) {
            if (!texto) return false;
            const textoNormalizado = texto.normalize('NFD').replace(/[\u0300-\u036f]/g, "").toLowerCase();
            
            return listaNegraPalavras.some(palavra => {
                const regex = new RegExp(`\\b${palavra}\\b`, 'i');
                return regex.test(textoNormalizado);
            });
        }

        // 🧠 Algoritmo Inteligente de Ranking FYP (Decay Temporal + Engajamento)
        function calcularPontuacaoPost(post) {
            const likes = post.like?.length || 0;
            const comentarios = post.comments?.length || 0;
            
            // Peso de Engajamento: Comentários valem mais que curtidas
            const engajamentoScore = (likes * 1.5) + (comentarios * 3.0);
            
            // Relevância Temporal (decay logarítmico em horas)
            const horasDesdeCriacao = Math.max(0.1, (new Date() - new Date(post.created_at)) / (1000 * 60 * 60));
            const gravity = 1.8;
            
            return (engajamentoScore + 1) / Math.pow(horasDesdeCriacao + 2, gravity);
        }

        async function initFYP() {
            const navMeuPerfil = document.getElementById('nav-meu-perfil');
            const { data: { session } } = await supabase.auth.getSession();

            if (session?.user) {
                usuarioLogado = session.user;
                try { await ensurePrivateApiKey(supabase); } catch (e) { console.error('Chave privada:', e); }

                const { data: perfil } = await supabase
                    .from('profiles')
                    .select('*')
                    .eq('id', usuarioLogado.id)
                    .single();

                if (perfil) {
                    if (perfil.age_verified !== true) {
                        window.location.href = "https://m.docedleite.com.br/verifyage";
                        return;
                    }
                    if (navMeuPerfil) navMeuPerfil.href = `/u/?q=${encodeURIComponent(perfil.username)}`;
                }
            }

            await carregarDadosDoBanco();
        }

        async function carregarDadosDoBanco() {
            const feedContainer = document.getElementById('feed-container');

            const [{ data: postsNormais, error: erroPosts }, { data: anuncios, error: erroAnuncios }] = await Promise.all([
                supabase.from('posts').select('*').eq('isddlAd', false).order('created_at', { ascending: false }).limit(20),
                supabase.from('posts').select('*').eq('isddlAd', true).order('created_at', { ascending: false }).limit(5)
            ]);

            if (erroPosts || erroAnuncios) {
                feedContainer.innerHTML = `<div class="empty-feed">Erro ao carregar feed: ${escapeHtml((erroPosts || erroAnuncios).message)}</div>`;
                return;
            }

            const posts = [...(postsNormais || []), ...(anuncios || [])];

            if (posts.length === 0) {
                feedContainer.innerHTML = `<div class="empty-feed">Ainda não há publicações. Seja o primeiro! 🌟</div>`;
                return;
            }

            postsGlobais = posts;

            // Busca profiles em batch eficiente
            const creatorIds = [...new Set(posts.map(p => p.creator))];
            const { data: perfisAutores } = await supabase.from('profiles').select('id, username, is_verified').in('id', creatorIds);

            perfisGlobais = {};
            if (perfisAutores) perfisAutores.forEach(p => perfisGlobais[p.id] = p);

            renderizarFeed();
        }

        window.mudarFiltro = function (tipo, elementoBtn) {
            if (filtroAtual === tipo) return;
            filtroAtual = tipo;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            elementoBtn.classList.add('active');
            renderizarFeed();
        };

        function renderizarFeed() {
            const feedContainer = document.getElementById('feed-container');
            if (!postsGlobais.length) return;

            let postsFiltrados = [...postsGlobais];

            // Aplicação dos Algoritmos de Ordenação
            if (filtroAtual === 'fyp') {
                postsFiltrados.sort((a, b) => calcularPontuacaoPost(b) - calcularPontuacaoPost(a));
            } else if (filtroAtual === 'popular') {
                postsFiltrados.sort((a, b) => ((b.like?.length || 0) + (b.comments?.length || 0)) - ((a.like?.length || 0) + (a.comments?.length || 0)));
            } else if (filtroAtual === 'media') {
                const totalEngajamento = postsFiltrados.reduce((acc, p) => acc + (p.like?.length || 0), 0);
                const media = postsFiltrados.length ? totalEngajamento / postsFiltrados.length : 0;
                postsFiltrados.sort((a, b) => Math.abs((a.like?.length || 0) - media) - Math.abs((b.like?.length || 0) - media));
            } else if (filtroAtual === 'novidades') {
                postsFiltrados.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
            }

            // Separação e Intercalação Estratégica de Anúncios (Patrocinados a cada 3 posts)
            const normais = postsFiltrados.filter(p => !p.isddlAd);
            const ads = postsFiltrados.filter(p => p.isddlAd);
            let feedFinal = [];
            let adIndex = 0;

            normais.forEach((post, idx) => {
                feedFinal.push(post);
                if ((idx + 1) % 3 === 0 && ads.length > 0) {
                    feedFinal.push(ads[adIndex % ads.length]);
                    adIndex++;
                }
            });

            feedContainer.innerHTML = '';

            feedFinal.forEach(post => {
                const autor = perfisGlobais[post.creator] || { username: 'desconhecido', is_verified: false };
                const ehAnon = post.isAnon === true;
                const ehAd = post.isddlAd === true;
                const likesArray = post.like || [];
                const euCurti = usuarioLogado ? likesArray.includes(usuarioLogado.id) : false;
                const comentariosArray = post.comments || [];

                const card = document.createElement('div');
                card.className = `post-card ${ehAd ? 'is-ad' : ''}`;
                card.id = `post-card-${post.id}`;

                let autorHTML = ehAd 
                    ? '<div class="ad-badge">📢 Patrocinado</div>' 
                    : ehAnon 
                        ? `<span class="post-author">🕵️ @anon</span>` 
                        : `<a href="/u/?q=${encodeURIComponent(autor.username)}" class="post-author">@${escapeHtml(autor.username)}${autor.is_verified ? '<img src="/verify.png" alt="Verificado" class="verified-badge">' : ''}</a>`;

                card.innerHTML = `
                    ${autorHTML}
                    <div class="post-content">${escapeHtml(post.title)}</div>
                    <div class="post-actions">
                        <button class="action-btn ${euCurti ? 'liked' : ''}" id="like-btn-${post.id}" onclick="curtirPost(${post.id})">
                            ❤️ <span id="like-count-${post.id}">${likesArray.length}</span>
                        </button>
                        <button class="action-btn" onclick="toggleComentarios(${post.id})">
                            💬 <span id="comment-count-${post.id}">${comentariosArray.length}</span>
                        </button>
                    </div>

                    <div id="comments-section-${post.id}" style="display: none; margin-top: 12px; border-top: 1px dashed #d7ccc8; padding-top: 10px;">
                        <div id="comments-list-${post.id}" style="max-height: 150px; overflow-y: auto; margin-bottom: 8px; font-size: 0.9rem;"></div>
                        ${ehAd ? `<div style="color: #8d6e63; font-size: 0.85rem; font-style: italic; text-align: center;">🚫 Comentários desativados para anúncios.</div>` : `
                            <div style="display: flex; gap: 8px;">
                                <input type="text" id="comment-input-${post.id}" placeholder="Escreva um comentário..." style="flex: 1; padding: 6px 10px; border: 1px solid #d7ccc8; border-radius: 6px; font-size: 0.85rem; outline: none;">
                                <button onclick="enviarComentario(${post.id})" style="padding: 6px 12px; background: #8d6e63; color: white; border: none; border-radius: 6px; font-size: 0.85rem; cursor: pointer; font-weight: bold;">Enviar</button>
                            </div>
                        `}
                    </div>
                `;
                feedContainer.appendChild(card);
            });
        }

        window.curtirPost = async function(postId) {
            if (!usuarioLogado) {
                alert("Faça login para curtir! 🔒");
                window.location.href = '/acesso/login/';
                return;
            }

            const post = postsGlobais.find(p => p.id === postId);
            if (!post) return;

            let likes = [...(post.like || [])];
            const idx = likes.indexOf(usuarioLogado.id);

            if (idx > -1) {
                likes.splice(idx, 1);
            } else {
                likes.push(usuarioLogado.id);
            }

            post.like = likes;

            // Atualização de UI em tempo real sem re-renderizar todo o feed!
            const likeBtn = document.getElementById(`like-btn-${postId}`);
            const likeCount = document.getElementById(`like-count-${postId}`);
            
            if (likeBtn && likeCount) {
                likeBtn.classList.toggle('liked', likes.includes(usuarioLogado.id));
                likeCount.textContent = likes.length;
            }

            await supabase.from('posts').update({ like: likes }).eq('id', postId);
        };

        window.toggleComentarios = async function(postId) {
            const section = document.getElementById(`comments-section-${postId}`);
            if (!section) return;
            const abrir = section.style.display === 'none';
            section.style.display = abrir ? 'block' : 'none';
            if (abrir) await carregarComentariosNoCard(postId);
        };

        async function carregarComentariosNoCard(postId) {
            const listContainer = document.getElementById(`comments-list-${postId}`);
            if (!listContainer) return;

            const post = postsGlobais.find(p => p.id === postId);
            const comentarios = post?.comments || [];

            if (comentarios.length === 0) {
                listContainer.innerHTML = '<div style="color: #8d6e63; font-size: 0.85rem; font-style: italic;">Nenhum comentário ainda. Seja o primeiro! 💬</div>';
                return;
            }

            listContainer.innerHTML = comentarios.map(c => `
                <div style="margin-bottom: 6px;">
                    <strong>@${escapeHtml(c.username)}:</strong> ${escapeHtml(c.text)}
                </div>
            `).join('');
        }

        window.enviarComentario = async function(postId) {
            if (!usuarioLogado) {
                alert("Faça login para comentar! 🔒");
                window.location.href = '/acesso/login/';
                return;
            }

            const postRef = postsGlobais.find(p => p.id === postId);
               if (postRef?.isddlAd) return;

            const input = document.getElementById(`comment-input-${postId}`);
            const textoComentario = input.value.trim();

            if (!textoComentario) return;

            if (verificarConteudoProibido(textoComentario)) {
                alert("⚠️ Comentário barrado pelas diretrizes da comunidade.");
                return;
            }

            const { data: perfil } = await supabase.from('profiles').select('username').eq('id', usuarioLogado.id).single();

            const novoComentario = {
                user_id: usuarioLogado.id,
                username: perfil ? perfil.username : 'anonimo',
                text: textoComentario,
                created_at: new Date().toISOString()
            };

            if (!postRef.comments) postRef.comments = [];
            postRef.comments.push(novoComentario);

            input.value = '';
            
            // Atualiza contagem local
            const commentCount = document.getElementById(`comment-count-${postId}`);
            if (commentCount) commentCount.textContent = postRef.comments.length;

            await carregarComentariosNoCard(postId);
            await supabase.from('posts').update({ comments: postRef.comments }).eq('id', postId);
        };

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        }

        initFYP();
    </script>
</body>
</html>
