<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width">
  <meta name="theme-color" content="#8d6e63">
  <style>
            * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fffaf0;
            color: #3e2723;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(111, 78, 55, 0.1);
            max-width: 600px;
            width: 90%;
            border: 2px dashed #d7ccc8;
        }
        h1 {
            font-size: 2.5rem;
            color: #8d6e63;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #5d4037;
        }
        .btn-entrar {
            display: inline-block;
            background-color: #8d6e63;
            color: white;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(141, 110, 99, 0.3);
        }
        .btn-entrar:hover {
            background-color: #6d4c41;
            transform: translateY(-2px);
        }
  </style>
  <title>Doce de Leite - Dia de Criação do Doce de Leite</title>
</head>
<body>
  <div class="container">
    <h1>Dia 31 de agosto de 2026</h1>
    <p>Dia 31/08/26 uma pessoa chamada Arthur Carolina da Costa Souza (dono da rede) decidiu criar uma rede social. A rede só se tornou oficial 1 dia antes da idependencia do brasil (dia 6/09/26 à noite) a rede realmente começou e saiu da versão beta</p>
  </div>
</body>
</html>
